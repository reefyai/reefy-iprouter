name: Verify and release IP Router image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iprouter-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Verify settings, firewall policy and release consistency
        run: |
          mkdir -p results
          python -m pytest tests --ignore=tests/e2e -q --junitxml=results/unit.xml
          python tools/check_release.py
      - name: Build the candidate once
        run: |
          docker build --pull --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/reefyai/reefy-iprouter \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$(cat VERSION)" \
            --tag iprouter-candidate:"$GITHUB_SHA" .
      - name: Check packaged UI without host privileges
        run: python tools/smoke_image.py --image iprouter-candidate:"$GITHUB_SHA" --output results/image.json
      - name: Export the tested release image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          python tools/check_release.py --tag "$GITHUB_REF_NAME"
          docker save iprouter-candidate:"$GITHUB_SHA" | gzip > results/image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iprouter-verification
          path: results/
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, network]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iprouter-verification
          path: results
      - name: Restore the exact tested image
        run: gzip -dc results/image.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and source tags without rebuilding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          IMAGE=ghcr.io/reefyai/reefy-iprouter
          VERSION="$RELEASE_TAG"
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo 'Version already published; choose a new release version.' >&2
            exit 1
          fi
          docker tag iprouter-candidate:"$GITHUB_SHA" "$IMAGE:$VERSION"
          docker tag iprouter-candidate:"$GITHUB_SHA" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker inspect "$IMAGE:$VERSION" --format '{{json .RepoDigests}}' > results/published-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: iprouter-published-digests
          path: results/published-digests.json

  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated network test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables dnsmasq-base busybox curl
          python -m pip install pytest
      - name: Verify DHCP, NAT, isolation, route refresh and restart
        run: |
          mkdir -p results
          sudo env REEFY_E2E_RESULTS_DIR="$PWD/results" "$pythonLocation/bin/python" -m pytest tests/e2e/router_lab -q --junitxml=results/network.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iprouter-network
          path: results/
